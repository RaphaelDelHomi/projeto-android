<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C+R</title>
    <style>
        /* IMPORTAÇÃO DAS FONTES */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    color:#fff;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top left,#ff4d8850,transparent 30%),
    radial-gradient(circle at bottom right,#8b5cf640,transparent 35%),
    linear-gradient(135deg,#090909,#121212,#181818);
}

/* Fundo animado */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle,#ffffff10 1px,transparent 1px);
    background-size:45px 45px;
    opacity:.25;
    pointer-events:none;
}

header{

    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);

    width:92%;
    max-width:1200px;

    padding:18px 30px;

    border-radius:18px;

    background:rgba(20,20,20,.55);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 40px rgba(0,0,0,.35);

    z-index:9999;

}

nav{

display:flex;
justify-content:center;
align-items:center;
gap:35px;

}

nav button{

background:none;
border:none;

font-family:'Poppins',sans-serif;
font-size:17px;
font-weight:600;

color:#ddd;

cursor:pointer;

position:relative;

transition:.35s;

}

nav button::after{

content:"";

position:absolute;

left:50%;
bottom:-8px;

width:0;

height:2px;

background:#ff4d88;

transition:.4s;

transform:translateX(-50%);

}

nav button:hover{

color:white;

transform:translateY(-2px);

}

nav button:hover::after{

width:100%;

}

.pagina{

display:none;

padding:150px 40px 80px;

animation:fade .6s ease;

min-height:100vh;

}

.ativa{

display:block;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:none;

}

}

/* HOME */

.inicio{

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

}

.inicio h1{

font-family:'Poppins',sans-serif;

font-size:72px;

font-weight:800;

background:linear-gradient(90deg,#ff5f9f,#ffc4da);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:25px;

}

.inicio p{

max-width:760px;

font-size:20px;

line-height:1.9;

color:#d8d8d8;

}

.contador{

margin-top:60px;

padding:35px;

width:100%;
max-width:700px;

border-radius:30px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

box-shadow:

0 25px 60px rgba(0,0,0,.35),

0 0 40px rgba(255,77,136,.08);

}

.contador h2{

font-family:'Poppins';

font-size:28px;

margin-bottom:20px;

color:#ff7eb2;

}

#tempo{

font-size:26px;

font-weight:700;

color:white;

line-height:1.8;

}

.titulo{

font-family:'Poppins';

font-size:50px;

text-align:center;

margin-bottom:55px;

}


.galeria{

max-width:1400px;

margin:auto;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:40px;

align-items:start;

padding:20px;

}

.foto{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

border-radius:25px;

overflow:hidden;

backdrop-filter:blur(20px);

transition:.45s;

box-shadow:

0 20px 50px rgba(0,0,0,.25);

}

.foto:hover{

transform:translateY(-12px);

box-shadow:

0 35px 70px rgba(255,77,136,.20);

}

.foto img{

width:100%;

height:340px;

object-fit:cover;

transition:.5s;

display:block;

}

.foto:hover img{

transform:scale(1.08);

}

.foto p{

padding:22px;

font-size:16px;

line-height:1.7;

color:#efefef;

}

.musicas{

max-width:950px;

margin:auto;

display:flex;

flex-direction:column;

gap:35px;

}

.musica{

background:rgba(255,255,255,.05);

padding:35px;

border-radius:25px;

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.08);

transition:.4s;

}

.musica:hover{

transform:translateY(-8px);

box-shadow:

0 25px 60px rgba(255,77,136,.18);

}

.musica h3{

font-family:'Poppins';

font-size:28px;

margin-bottom:18px;

color:#ff78ab;

}

.musica p{

line-height:1.9;

color:#ddd;

margin-bottom:20px;

}

audio{

width:100%;

}

footer{

padding:35px;

margin-top:80px;

text-align:center;

color:#aaa;

border-top:1px solid rgba(255,255,255,.08);

background:rgba(255,255,255,.03);

backdrop-filter:blur(20px);

}

/* Scroll */

::-webkit-scrollbar{

width:11px;

}

::-webkit-scrollbar-thumb{

background:#ff4d88;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:#121212;

}
.hero{

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

min-height:80vh;

}

.badge{

padding:10px 22px;

border-radius:50px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

margin-bottom:30px;

font-size:15px;

backdrop-filter:blur(20px);

}

.heroBtns{

display:flex;

gap:20px;

margin-top:40px;

flex-wrap:wrap;

justify-content:center;

}

.heroBtns button{

padding:18px 34px;

border:none;

border-radius:50px;

cursor:pointer;

font-size:16px;

font-weight:600;

font-family:Poppins;

transition:.35s;

background:linear-gradient(135deg,#ff4d88,#ff80b3);

color:white;

box-shadow:0 10px 30px rgba(255,77,136,.35);

}

.heroBtns button:hover{

transform:translateY(-5px) scale(1.03);

}

.secundario{

background:rgba(255,255,255,.05)!important;

border:1px solid rgba(255,255,255,.08)!important;

box-shadow:none!important;

}

.secundario:hover{

background:rgba(255,255,255,.12)!important;

}

.seta{

margin-top:70px;

font-size:40px;

animation:seta 1.8s infinite;

opacity:.6;

}

@keyframes seta{

0%{

transform:translateY(0);

}

50%{

transform:translateY(12px);

}

100%{

transform:translateY(0);

}

}
    </style>
</head>
<body>
    <section class="pagina ativa inicio" id="home">

    <div class="hero">

        <span class="badge">❤️ Nosso Cantinho Especial</span>

        <h1>Raphael & Camilly</h1>

        <p>
            Esse site é nosso cantinho especial.
            Um lugar onde guardamos nossas memórias,
            sentimentos, músicas e momentos inesquecíveis.
            Cada detalhe aqui representa um pedaço da nossa história.
        </p>

        <div class="contador">

            <h2>Estamos juntos há</h2>

            <h3 id="tempo"></h3>

        </div>

        <div class="heroBtns">

            <button onclick="mostrarPagina('fotos')">
                📸 Ver nossas memórias
            </button>

            <button onclick="mostrarPagina('musicas')" class="secundario">
                🎵 Ouvir nossas músicas
            </button>

        </div>

        <div class="seta">
            ↓
        </div>

    </div>

</section>
</body>
</html>
